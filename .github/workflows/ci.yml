name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-cov pip-audit ruff
      - name: Lint (ruff)
        run: ruff check apps/api tests || true
      - name: Tests with coverage gate
        env:
          PHISHNET_API_KEYS: "ci-key:ci"
        run: python -m pytest tests/ --cov=apps/api/app --cov-report=term-missing --cov-fail-under=45
      - name: Dependency vulnerability scan
        run: pip-audit -r apps/api/requirements.txt || true

  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [apps/web, apps/runner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci || npm install
      - name: Audit
        working-directory: ${{ matrix.app }}
        run: npm audit --audit-level=high || true
      - name: Syntax check (runner)
        if: matrix.app == 'apps/runner'
        working-directory: ${{ matrix.app }}
        run: node --check server.js
