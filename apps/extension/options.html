<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PhishNet Options</title>
  <style>
    body { font: 14px/1.5 Arial, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
    button { margin-top: 18px; padding: 8px 14px; cursor: pointer; }
    .muted { color: #5f6368; font-size: 12px; }
    #saved { color: #1a7f37; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>PhishNet settings</h1>

  <label for="backendUrl">Backend URL</label>
  <input type="text" id="backendUrl" placeholder="http://localhost:8002" />
  <div class="muted">Where your PhishNet backend runs. Local by default; point this at a hosted instance to use it anywhere.</div>

  <label for="method">Engines</label>
  <input type="text" id="method" placeholder="heuristic,bert" />
  <div class="muted">Comma-separated: heuristic, bert, llm. (LLM is slower/heavier — leave it off unless your backend has it.)</div>

  <div class="row">
    <input type="checkbox" id="personalize" />
    <label for="personalize" style="margin:0;">Personalize verdicts on this device (learns from your feedback)</label>
  </div>

  <div>
    <button id="save">Save</button><span id="saved"></span>
  </div>

  <div class="row" style="margin-top:28px;">
    <button id="reset">Reset learned personalization</button>
  </div>
  <div class="muted" id="stats"></div>

  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
